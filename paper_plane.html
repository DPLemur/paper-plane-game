<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сложи самолётик</title>
<style>
  :root{
    --paper:#f6f3ea;
    --paper-shadow:#d8d2bf;
    --ink:#2b2a28;
    --accent:#3f6b5c;
    --accent-soft:#e4ece8;
    --line:#c9c2ae;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#efece2;
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 40px;
  }
  h1{
    font-size:1.4rem;
    font-weight:600;
    letter-spacing:.02em;
    margin:0 0 4px;
  }
  p.sub{
    margin:0 0 20px;
    font-size:.92rem;
    color:#6b6558;
    max-width:480px;
    text-align:center;
    line-height:1.4;
  }
  .stage{
    position:relative;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(0,0,0,.06);
  }
  canvas{display:block;}
  .controls{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    font-family:inherit;
    font-size:.85rem;
    padding:9px 16px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    border-radius:3px;
    transition:background .15s, color .15s;
  }
  button:hover{background:var(--ink); color:#fff;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary:hover{background:#345a4d;}
  button:disabled{opacity:.35; cursor:default;}
  button:disabled:hover{background:transparent; color:var(--ink);}
  .readout{
    margin-top:18px;
    font-size:.85rem;
    color:#4a463c;
    min-height:1.2em;
    text-align:center;
  }
  .hint{
    font-size:.78rem;
    color:#96907e;
    margin-top:4px;
  }
  .section-title{
    font-size:.95rem;
    font-weight:600;
    margin:28px 0 10px;
    color:var(--ink);
  }
  .stage3d canvas{ cursor:grab; }
  .stage3d canvas:active{ cursor:grabbing; }
  .spread-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    font-size:.85rem;
  }
  .spread-row input[type=range]{ width:200px; }
  .spread-row span{ min-width:2.4em; color:#4a463c; }
</style>
</head>
<body>

  <h1>Сложи самолётик</h1>
  <p class="sub">Тяни уголки листа мышкой, чтобы сгибать бумагу. Собери самолётик и запусти тест на склоне — посмотрим, далеко ли он улетит.</p>

  <div class="stage">
    <canvas id="foldCanvas" width="480" height="480"></canvas>
  </div>

  <div class="controls">
    <button id="undoBtn">Отменить сгиб</button>
    <button id="flipBtn">Перевернуть лист</button>
    <button id="resetBtn">Начать заново</button>
    <button id="testBtn" class="primary">Тест на склоне</button>
  </div>

  <div class="readout" id="readout"></div>
  <div class="hint">Захватывай именно уголки листа — маленькие точки на контуре.</div>

  <h2 class="section-title">3D-модель собранного листа</h2>
  <div class="stage stage3d">
    <canvas id="scene3d" width="480" height="360"></canvas>
  </div>
  <div class="spread-row">
    <label for="spreadSlider">Раскрытие складок</label>
    <input type="range" id="spreadSlider" min="0" max="100" value="0">
    <span id="spreadValue">0%</span>
  </div>
  <div class="hint">Тяни мышкой по 3D-модели, чтобы покрутить камеру.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  const canvas = document.getElementById('foldCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- geometry helpers ----------
  function sub(a,b){return {x:a.x-b.x, y:a.y-b.y};}
  function add(a,b){return {x:a.x+b.x, y:a.y+b.y};}
  function scale(a,s){return {x:a.x*s, y:a.y*s};}
  function dot(a,b){return a.x*b.x + a.y*b.y;}
  function len(a){return Math.hypot(a.x,a.y);}
  function normalize(a){const l=len(a)||1; return {x:a.x/l, y:a.y/l};}

  function polygonArea(pts){
    let s=0;
    for(let i=0;i<pts.length;i++){
      const p=pts[i], q=pts[(i+1)%pts.length];
      s += p.x*q.y - q.x*p.y;
    }
    return Math.abs(s)/2;
  }

  function convexHull(points){
    const pts = points.slice().sort((a,b)=> a.x-b.x || a.y-b.y);
    if(pts.length<3) return pts;
    const cross=(o,a,b)=> (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x);
    const lower=[];
    for(const p of pts){
      while(lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop();
      lower.push(p);
    }
    const upper=[];
    for(let i=pts.length-1;i>=0;i--){
      const p=pts[i];
      while(upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop();
      upper.push(p);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  // Sutherland-Hodgman clip: keep points where dot(p-linePoint,normal) has given sign
  function clipHalfPlane(pts, linePoint, normal, keepPositive){
    const out=[];
    const side = p => {
      const d = dot(sub(p,linePoint), normal);
      return keepPositive ? d>=0 : d<=0;
    };
    const intersect = (a,b) => {
      const da = dot(sub(a,linePoint), normal);
      const db = dot(sub(b,linePoint), normal);
      const t = da/(da-db);
      return add(a, scale(sub(b,a), t));
    };
    for(let i=0;i<pts.length;i++){
      const cur = pts[i], prev = pts[(i-1+pts.length)%pts.length];
      const curIn = side(cur), prevIn = side(prev);
      if(curIn){
        if(!prevIn) out.push(intersect(prev,cur));
        out.push(cur);
      } else if(prevIn){
        out.push(intersect(prev,cur));
      }
    }
    return out;
  }

  // ---------- state ----------
  const START_W = 220, START_H = 320;
  const cx0 = W/2, cy0 = H/2;
  function startShape(){
    return [
      {x:cx0-START_W/2, y:cy0-START_H/2},
      {x:cx0+START_W/2, y:cy0-START_H/2},
      {x:cx0+START_W/2, y:cy0+START_H/2},
      {x:cx0-START_W/2, y:cy0+START_H/2},
    ];
  }

  let shape = startShape();
  const CANON_POSITIVE = polygonSignedArea(shape) > 0;
  let history = [];
  let dragIndex = -1;
  let dragTarget = null;

  // ---------- 3D panel/hinge model ----------
  // The flat 2D silhouette above stays authoritative for fold interaction
  // and for the aerodynamics heuristics — it's simple, well-tested, and the
  // spec itself says folds should still be computed in the flat 2D plane.
  // Alongside it we track how the sheet is actually built out of flat
  // panels connected by hinges, purely so it can be shown folded up in real
  // 3D and "sprung open" a little at the end (giving genuine dihedral
  // angles), instead of always lying flattened on one plane.
  //
  // Every fold cuts ALL existing panels by the same line: whatever piece of
  // a panel ends up on the dragged-corner side is reflected in 2D (as
  // before) but is ALSO kept in its pre-fold, unreflected form together
  // with the hinge line — that's enough to place it at any fold angle in
  // 3D later (180° reflection is just a special case of rotating the flap
  // 180° around the crease line, in the plane it started in).
  let panels = [{ poly2d: shape.map(p=>({x:p.x,y:p.y})), hingeChain: [] }];
  let hinges = []; // { axisP:{x,y}, axisDir:{x,y}(unit), angle(deg), ancestorChain:[hinge idx,...] }

  function clonePanels(ps){
    return ps.map(p=>({ poly2d: p.poly2d.map(pt=>({x:pt.x,y:pt.y})), hingeChain: p.hingeChain.slice() }));
  }
  function cloneHinges(hs){
    return hs.map(h=>({ axisP:{x:h.axisP.x,y:h.axisP.y}, axisDir:{x:h.axisDir.x,y:h.axisDir.y}, angle:h.angle, ancestorChain:h.ancestorChain.slice() }));
  }

  // Cut every current panel by the same (M, normal) half-plane the 2D fold
  // just used, and record a new hinge for whatever moved to the dragged
  // corner's side. A panel that straddles the line is split in two, one
  // piece staying and one becoming part of the new hinge's flap — exactly
  // what happens physically to every layer of paper caught in a fold.
  //
  // A panel's `poly2d` is stored fully "unwound" — i.e. at angle 0 for
  // EVERY hinge in its chain, not just the last — because pointFromChain-
  // WithAxes always replays the whole chain from scratch. Since M/normal
  // describe the CURRENT (fully closed) 2D silhouette, every existing
  // panel must first be placed at its current closed-world position before
  // being cut by that line (or a panel that already moved would get
  // sliced in the wrong place), and every result must then be unwound back
  // through that same chain before being stored (or replaying the chain
  // later would apply its earlier hinges twice). Any live "spread" from
  // the slider is display-only and is ignored here — folding always
  // reasons about the flat, closed paper.
  function applyFoldToPanels(M, normal){
    const axesClosed = computeWorldAxesWithAngles(()=>180);
    const newHingeIndex = hinges.length;
    const newPanels = [];
    let ancestorChain = null;
    panels.forEach(panel=>{
      const worldPoly = panel.poly2d.map(pt=>{
        const w = pointFromChainWithAxes(pt, panel.hingeChain, axesClosed, ()=>180);
        return {x:w.x, y:w.y};
      });
      const stayWorld = clipHalfPlane(worldPoly, M, normal, true);
      const moveWorld = clipHalfPlane(worldPoly, M, normal, false);
      const stayOk = stayWorld.length>=3 && polygonArea(stayWorld)>0.75;
      const moveOk = moveWorld.length>=3 && polygonArea(moveWorld)>0.75;
      if(stayOk){
        const localStay = stayWorld.map(pt=> undoClosedChain(pt, panel.hingeChain, axesClosed));
        newPanels.push({ poly2d: localStay, hingeChain: panel.hingeChain.slice() });
        if(ancestorChain===null) ancestorChain = panel.hingeChain.slice();
      }
      if(moveOk){
        // unwind through the panel's EXISTING chain only — the new hinge
        // itself hasn't acted yet, so this is already its correct angle-0
        // shape for the longer chain (existing chain + this new hinge).
        const localMove = moveWorld.map(pt=> undoClosedChain(pt, panel.hingeChain, axesClosed));
        newPanels.push({ poly2d: localMove, hingeChain: panel.hingeChain.concat(newHingeIndex) });
      }
      if(!stayOk && !moveOk){
        // degenerate sliver under this cut — keep the panel untouched
        // rather than silently lose paper.
        newPanels.push(panel);
      }
    });
    // M/dir are likewise in current closed-world coordinates and must be
    // unwound through this hinge's own ancestor chain before storing, so
    // that re-deriving its world position later (via computeWorldAxes-
    // WithAngles) starts from the same convention as everything else.
    const dir = normalize({x:-normal.y, y:normal.x});
    const chain = ancestorChain || [];
    const localAxisP = undoClosedChain(M, chain, axesClosed);
    const localAxisQ = undoClosedChain({x:M.x+dir.x, y:M.y+dir.y}, chain, axesClosed);
    const localAxisDir = normalize({x:localAxisQ.x-localAxisP.x, y:localAxisQ.y-localAxisP.y});
    hinges.push({ axisP:localAxisP, axisDir:localAxisDir, angle:180, ancestorChain: chain });
    panels = newPanels;
  }

  function pushHistory(){
    history.push({ shape: shape.map(p=>({x:p.x,y:p.y})), panels: clonePanels(panels), hinges: cloneHinges(hinges) });
    if(history.length>30) history.shift();
  }

  // ---------- fold operation ----------
  // A real paper fold does NOT collapse to the convex hull of the two
  // pieces: the folded flap can leave a concave notch or step where it
  // doesn't line up with the base outline (that's exactly what makes a
  // paper airplane look like a paper airplane). So instead of hulling the
  // union, we glue the base and the reflected flap together along their
  // shared fold-line edge and trace the real (possibly concave) outline.

  function polygonSignedArea(pts){
    let s=0;
    for(let i=0;i<pts.length;i++){
      const p=pts[i], q=pts[(i+1)%pts.length];
      s += p.x*q.y - q.x*p.y;
    }
    return s/2;
  }

  function fixWinding(pts, wantPositive){
    const a = polygonSignedArea(pts);
    return ((wantPositive && a<0) || (!wantPositive && a>0)) ? pts.slice().reverse() : pts.slice();
  }

  function pointsClose(a,b,eps){ return Math.abs(a.x-b.x)<eps && Math.abs(a.y-b.y)<eps; }

  function findCommonPoints(a, b, eps){
    eps = eps||0.5;
    const out=[];
    a.forEach(p=>{
      if(b.some(q=>pointsClose(p,q,eps)) && !out.some(o=>pointsClose(o,p,eps))) out.push(p);
    });
    return out;
  }

  function cleanupPolygon(pts, eps){
    eps = eps||0.5;
    let out = [];
    for(let i=0;i<pts.length;i++){
      const p = pts[i];
      if(out.length===0 || !pointsClose(out[out.length-1], p, eps)) out.push(p);
    }
    if(out.length>1 && pointsClose(out[0], out[out.length-1], eps)) out.pop();
    let changed = true;
    while(changed && out.length>3){
      changed = false;
      for(let i=0;i<out.length;i++){
        const a = out[(i-1+out.length)%out.length], b = out[i], c = out[(i+1)%out.length];
        const cross = (b.x-a.x)*(c.y-a.y) - (b.y-a.y)*(c.x-a.x);
        const scaleRef = Math.max(len(sub(b,a)), len(sub(c,b)), 1);
        if(Math.abs(cross) < eps*scaleRef){ out.splice(i,1); changed = true; break; }
      }
    }
    return out;
  }

  function segCross(o,a,b){ return (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x); }
  function segmentsProperlyIntersect(p1,p2,p3,p4){
    const d1 = segCross(p3,p4,p1), d2 = segCross(p3,p4,p2);
    const d3 = segCross(p1,p2,p3), d4 = segCross(p1,p2,p4);
    return ((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0));
  }

  function isSimplePolygon(pts){
    const n = pts.length;
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const nextI=(i+1)%n, nextJ=(j+1)%n;
        if(j===i || j===nextI || nextJ===i) continue;
        if(segmentsProperlyIntersect(pts[i],pts[nextI],pts[j],pts[nextJ])) return false;
      }
    }
    return true;
  }

  function pointInPolygon(pt, poly){
    let inside = false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
      const hit = ((yi>pt.y)!==(yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/((yj-yi)||1e-9)+xi);
      if(hit) inside = !inside;
    }
    return inside;
  }

  function distToSegment(p,a,b){
    const ab = sub(b,a);
    const t = Math.max(0, Math.min(1, dot(sub(p,a),ab)/(dot(ab,ab)||1)));
    return len(sub(p, add(a, scale(ab,t))));
  }

  function allVerticesWithin(poly, container, eps){
    eps = eps||1.5;
    return poly.every(p=>{
      if(pointInPolygon(p, container)) return true;
      return container.some((a,i)=> distToSegment(p, a, container[(i+1)%container.length]) < eps);
    });
  }

  // General polygon union (Weiler-Atherton style), specialised for our two
  // inputs: `base` (the part of the paper that stays put) and `flap` (the
  // reflected part), which always share the fold line as a coincident edge
  // through h1/h2. Real overlap between flap and base — the flap tucking
  // partway under/over the base — is common and must be resolved properly,
  // not hulled away, or the notches/steps that make the silhouette
  // recognisable as a folded shape get erased.
  function segIntersectParam(p1,p2,p3,p4){
    const r = sub(p2,p1), s = sub(p4,p3);
    const denom = r.x*s.y - r.y*s.x;
    if(Math.abs(denom) < 1e-9) return null;
    const qp = sub(p3,p1);
    const t = (qp.x*s.y - qp.y*s.x)/denom;
    const u = (qp.x*r.y - qp.y*r.x)/denom;
    const eps = 1e-6;
    if(t<eps || t>1-eps || u<eps || u>1-eps) return null;
    return { t, pt: add(p1, scale(r,t)) };
  }

  function unionKey(p){ return Math.round(p.x*20)+','+Math.round(p.y*20); }

  // Walk polygon P's edges, splicing in every point where it crosses Q, plus
  // any of `switchPoints` (the shared hinge vertices) so the walk can hop
  // between P and Q there even when they don't otherwise cross.
  function buildAugmented(P, Q, switchPoints){
    const augmented = [];
    for(let i=0;i<P.length;i++){
      const a = P[i], b = P[(i+1)%P.length];
      augmented.push({ pt:a, cross: switchPoints.some(sp=>pointsClose(sp,a,0.75)) });
      const hits = [];
      for(let j=0;j<Q.length;j++){
        const res = segIntersectParam(a,b, Q[j], Q[(j+1)%Q.length]);
        if(res) hits.push(res);
      }
      hits.sort((h1,h2)=>h1.t-h2.t);
      hits.forEach(h=> augmented.push({ pt:h.pt, cross:true }));
    }
    return augmented;
  }

  function unionAlongHinge(partB, flapRaw, h1, h2){
    const base = fixWinding(partB, CANON_POSITIVE);
    const flap = fixWinding(flapRaw, CANON_POSITIVE);
    if(allVerticesWithin(flap, base)) return base;
    if(allVerticesWithin(base, flap)) return flap;

    const switchPoints = [h1,h2];
    const augBase = buildAugmented(base, flap, switchPoints);
    const augFlap = buildAugmented(flap, base, switchPoints);

    const flapIndexByKey = new Map();
    augFlap.forEach((v,idx)=>{ if(v.cross && !flapIndexByKey.has(unionKey(v.pt))) flapIndexByKey.set(unionKey(v.pt), idx); });
    const baseIndexByKey = new Map();
    augBase.forEach((v,idx)=>{ if(v.cross && !baseIndexByKey.has(unionKey(v.pt))) baseIndexByKey.set(unionKey(v.pt), idx); });

    let startIdx = -1;
    for(let i=0;i<augBase.length;i++){
      if(!augBase[i].cross && !pointInPolygon(augBase[i].pt, flap)){ startIdx = i; break; }
    }
    if(startIdx<0) return null; // base fully covered by flap in a way we couldn't shortcut above

    let onBase = true, idx = startIdx;
    const result = [];
    const maxSteps = (augBase.length+augFlap.length)*3 + 30;
    for(let steps=0; ; steps++){
      const cur = onBase ? augBase : augFlap;
      const v = cur[idx];
      result.push(v.pt);

      if(v.cross){
        const nextV = cur[(idx+1)%cur.length];
        const mid = scale(add(v.pt,nextV.pt), 0.5);
        const other = onBase ? flap : base;
        if(pointInPolygon(mid, other)){
          const key = unionKey(v.pt);
          const j = onBase ? flapIndexByKey.get(key) : baseIndexByKey.get(key);
          if(j===undefined) return null;
          onBase = !onBase;
          idx = j;
        }
      }

      idx = (idx+1) % (onBase ? augBase.length : augFlap.length);
      if(onBase && idx===startIdx) break;
      if(steps>maxSteps) return null;
    }
    return result;
  }

  function computeFold(vertexIndex, targetPoint){
    const P0 = shape[vertexIndex];
    const P1 = targetPoint;
    if(len(sub(P1,P0)) < 6) return null; // too small a fold, ignore

    const M = scale(add(P0,P1), 0.5);
    const normal = normalize(sub(P1,P0)); // P0 side = negative, P1 side = positive

    const partA = clipHalfPlane(shape, M, normal, false); // P0 side (folds over)
    const partB = clipHalfPlane(shape, M, normal, true);  // stays

    if(partA.length<3 || partB.length<3) return null; // degenerate fold, ignore

    const reflectedA = partA.map(p=>{
      const d = dot(sub(p,M), normal);
      return sub(p, scale(normal, 2*d));
    });

    let merged = null;
    const hinge = findCommonPoints(partA, partB);
    if(hinge.length===2){
      merged = unionAlongHinge(partB, reflectedA, hinge[0], hinge[1]);
      if(merged) merged = cleanupPolygon(merged);
      if(!merged || merged.length<3 || polygonArea(merged)<1 || !isSimplePolygon(merged)){
        merged = null;
      }
    }

    // Last-resort fallback for cuts we can't cleanly trace (e.g. a line
    // crossing an already-concave outline more than twice) — better a
    // slightly-too-convex shape than a broken/self-crossing one.
    if(!merged) merged = convexHull(partB.concat(reflectedA));

    return merged.length>=3 ? merged : null;
  }

  function foldTo(vertexIndex, targetPoint){
    const merged = computeFold(vertexIndex, targetPoint);
    if(!merged) return;
    const P0 = shape[vertexIndex];
    const M = scale(add(P0,targetPoint), 0.5);
    const normal = normalize(sub(targetPoint,P0));
    pushHistory();
    shape = merged;
    applyFoldToPanels(M, normal);
    render3D();
  }

  function flipShape(){
    const xs = shape.map(p=>p.x);
    const cx = (Math.min(...xs)+Math.max(...xs))/2;
    pushHistory();
    shape = fixWinding(shape.map(p=>({x: 2*cx - p.x, y: p.y})), CANON_POSITIVE);
    panels = panels.map(p=>({
      poly2d: p.poly2d.map(pt=>({x: 2*cx-pt.x, y: pt.y})),
      hingeChain: p.hingeChain.slice()
    }));
    hinges = hinges.map(h=>({
      axisP: {x: 2*cx-h.axisP.x, y:h.axisP.y},
      axisDir: {x: -h.axisDir.x, y: h.axisDir.y},
      angle: h.angle,
      ancestorChain: h.ancestorChain.slice()
    }));
    render3D();
  }

  function undo(){
    if(history.length===0) return;
    const prev = history.pop();
    shape = prev.shape;
    panels = prev.panels;
    hinges = prev.hinges;
    render3D();
  }

  function reset(){
    pushHistory();
    shape = startShape();
    panels = [{ poly2d: shape.map(p=>({x:p.x,y:p.y})), hingeChain: [] }];
    hinges = [];
    history = [];
    updateReadout('');
    render3D();
  }

  // ---------- drawing ----------
  function draw(){
    ctx.clearRect(0,0,W,H);

    // subtle grid backdrop
    ctx.strokeStyle = '#f0ede3';
    ctx.lineWidth = 1;
    for(let x=0;x<W;x+=24){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0;y<H;y+=24){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    drawPolygon(shape, '#f6f3ea', '#8a8370', 2);

    // draggable vertex handles
    shape.forEach((p,i)=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y, i===dragIndex?7:5, 0, Math.PI*2);
      ctx.fillStyle = i===dragIndex ? '#3f6b5c' : '#4a463c';
      ctx.fill();
    });

    // drag preview
    if(dragIndex>=0 && dragTarget){
      const P0 = shape[dragIndex];
      ctx.setLineDash([5,4]);
      ctx.strokeStyle = '#3f6b5c';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(P0.x,P0.y);
      ctx.lineTo(dragTarget.x,dragTarget.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // preview of resulting shape
      const P1 = dragTarget;
      if(len(sub(P1,P0))>=6){
        const merged = computeFold(dragIndex, P1);
        if(merged) drawPolygon(merged, 'rgba(63,107,92,0.18)', 'rgba(63,107,92,0.6)', 1.5, true);
      }
    }
  }

  function drawPolygon(pts, fill, stroke, width, dashed){
    ctx.beginPath();
    pts.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.closePath();
    if(dashed){ ctx.setLineDash([4,3]); }
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = width;
    ctx.stroke();
    if(dashed){ ctx.setLineDash([]); }
  }

  // ---------- mouse interaction ----------
  function mousePos(evt){
    const r = canvas.getBoundingClientRect();
    return { x: (evt.clientX-r.left) * (canvas.width/r.width),
             y: (evt.clientY-r.top) * (canvas.height/r.height) };
  }

  canvas.addEventListener('mousedown', e=>{
    const pos = mousePos(e);
    let best=-1, bestD=18;
    shape.forEach((p,i)=>{
      const d = len(sub(p,pos));
      if(d<bestD){ bestD=d; best=i; }
    });
    if(best>=0){ dragIndex=best; dragTarget=pos; }
  });
  canvas.addEventListener('mousemove', e=>{
    if(dragIndex>=0){ dragTarget = mousePos(e); draw(); }
  });
  window.addEventListener('mouseup', e=>{
    if(dragIndex>=0){
      const pos = mousePos(e);
      foldTo(dragIndex, pos);
      dragIndex=-1; dragTarget=null;
      draw();
    }
  });

  // ---------- aerodynamics ----------
  // The fold engine can now produce genuinely concave outlines (notches,
  // tucked-under flaps, protruding corners). A couple of the original
  // heuristics assumed a roughly convex, hull-like shape and need to be
  // made robust to that; this also adds the "mass distribution along the
  // length" heuristic from Модуль 4 of the spec, which wasn't implemented.

  // Exact area centroid via the standard polygon-centroid formula (valid
  // for any simple polygon, convex or concave) — used both for scoring and
  // for pivoting the plane silhouette in the slope-test animation.
  function polygonCentroid(pts){
    let a=0, cx=0, cy=0;
    for(let i=0;i<pts.length;i++){
      const p=pts[i], q=pts[(i+1)%pts.length];
      const cross = p.x*q.y - q.x*p.y;
      a += cross;
      cx += (p.x+q.x)*cross;
      cy += (p.y+q.y)*cross;
    }
    a *= 0.5;
    if(Math.abs(a) < 1e-6){
      const n = pts.length || 1;
      return { x: pts.reduce((s,p)=>s+p.x,0)/n, y: pts.reduce((s,p)=>s+p.y,0)/n };
    }
    return { x: cx/(6*a), y: cy/(6*a) };
  }

  // Left/right (or top/bottom) area balance across the centerline. A
  // half-plane clip assumes the cutting line crosses the boundary exactly
  // twice, which convex hulls always satisfied but a concave silhouette
  // with several notches along its length may not — so this samples the
  // polygon on a grid instead, which stays correct for any simple polygon.
  function estimateSymmetry(pts, mainAxisX, centerline, minX, maxX, minY, maxY){
    const GRID = 40;
    const stepX = Math.max((maxX-minX)/GRID, 0.001);
    const stepY = Math.max((maxY-minY)/GRID, 0.001);
    let sideA=0, sideB=0;
    for(let i=0;i<GRID;i++){
      const px = minX + (i+0.5)*stepX;
      for(let j=0;j<GRID;j++){
        const py = minY + (j+0.5)*stepY;
        if(!pointInPolygon({x:px,y:py}, pts)) continue;
        const onA = mainAxisX ? py < centerline : px < centerline;
        if(onA) sideA++; else sideB++;
      }
    }
    const total = sideA+sideB;
    return total>0 ? 1 - Math.abs(sideA-sideB)/total : 0;
  }

  // Prefer, among the vertices at (or very near) the extreme front, the one
  // closest to the centerline — a stray protruding flap corner can now tie
  // or beat the true symmetric nose tip on raw extremity alone.
  function pickNose(pts, mainAxisX, minX, maxX, minY, maxY){
    const extreme = mainAxisX ? minX : minY;
    const tol = 6;
    const candidates = pts.filter(p => (mainAxisX ? p.x : p.y) <= extreme+tol);
    if(candidates.length<=1) return candidates[0] || pts[0];
    const midY = (minY+maxY)/2, midX = (minX+maxX)/2;
    return candidates.slice().sort((a,b)=>{
      const da = mainAxisX ? Math.abs(a.y-midY) : Math.abs(a.x-midX);
      const db = mainAxisX ? Math.abs(b.y-midY) : Math.abs(b.x-midX);
      return da-db;
    })[0];
  }

  function evaluateFlight(pts){
    const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
    const minX=Math.min(...xs), maxX=Math.max(...xs);
    const minY=Math.min(...ys), maxY=Math.max(...ys);
    const width = maxX-minX, height = maxY-minY;
    const mainAxisX = width>=height;

    const length = mainAxisX ? width : height;
    const span = mainAxisX ? height : width;

    const nose = pickNose(pts, mainAxisX, minX, maxX, minY, maxY);
    const idx = pts.indexOf(nose);
    const prev = pts[(idx-1+pts.length)%pts.length];
    const next = pts[(idx+1)%pts.length];
    const v1 = normalize(sub(prev,nose)), v2 = normalize(sub(next,nose));
    const angle = Math.acos(Math.max(-1,Math.min(1,dot(v1,v2)))) * 180/Math.PI;
    const noseScore = Math.max(0, Math.min(1, 1 - angle/140));

    // symmetry across the centerline perpendicular to the main axis
    const centerline = mainAxisX ? (minY+maxY)/2 : (minX+maxX)/2;
    const symmetry = estimateSymmetry(pts, mainAxisX, centerline, minX, maxX, minY, maxY);

    const elongation = span>0 ? length/span : 0;
    const elongationScore = Math.max(0, Math.min(1, 1 - Math.abs(elongation-2.6)/2.6));

    // where the paper's area is concentrated along the nose-to-tail axis —
    // a glider wants its center of area a bit forward of the midpoint for
    // pitch stability; too nose-heavy or too tail-heavy both wobble more.
    const centroid = polygonCentroid(pts);
    const alongNose = mainAxisX ? minX : minY;
    const alongTail = mainAxisX ? maxX : maxY;
    const alongCentroid = mainAxisX ? centroid.x : centroid.y;
    const massFrac = (alongCentroid - alongNose) / ((alongTail-alongNose) || 1);
    const idealMassFrac = 0.44;
    const massScore = Math.max(0, Math.min(1, 1 - Math.abs(massFrac-idealMassFrac)/idealMassFrac));

    const score = 0.32*symmetry + 0.24*noseScore + 0.24*elongationScore + 0.20*massScore;
    const distance = Math.round(8 + score*40);
    const wobble = Math.round((1-symmetry)*20 + (1-massScore)*10);

    return {score, distance, wobble, symmetry, noseScore, elongationScore, massScore, massFrac, mainAxisX, minX, maxX, minY, maxY};
  }

  // ---------- extended (3D) aerodynamics — Пункт 2 дополнения ----------
  // Everything above stays 2D and is the "dart" baseline the spec asks to
  // keep. These add the parameters that only exist once the paper has real
  // 3D structure: dihedral (how far the panels the player folded are
  // currently sprung open, via the Раскрытие slider from Пункт 1), wing
  // aspect ratio and wing loading (from each panel's true vs top-down
  // projected area), and a center-of-gravity that actually accounts for
  // stacked layers (overlapping panels each pull the weighted centroid
  // toward themselves, so a point with 3 layers counts 3x — no separate
  // "layer count" grid needed).
  //
  // There's no per-panel "this is a wing" flag — a panel that has never
  // moved (hingeChain empty) is treated as the untouched fuselage/keel;
  // everything that resulted from at least one fold is treated as a
  // "carrying" panel and pooled by area. This is a deliberate
  // simplification: it matches the common case where the folds you make
  // ARE the wings, and keeps the model from needing the player to mark
  // anything by hand — see the module comment above computeAerodynamics3D.
  const GLIDER_MAX_LOADING = 2.2;   // total paper area / projected wing area
  const GLIDER_MIN_AR = 1.0;        // wingspan^2 / projected wing area
  const GLIDER_MIN_DIHEDRAL = 2;    // degrees; spec: <=0 means dart-only

  function computeAerodynamics3D(pts, base){
    const { mainAxisX, minX, maxX, minY, maxY } = base;
    const getAngle = i => hinges[i].angle;
    const axes = computeWorldAxesWithAngles(getAngle);
    const flatTotalArea = polygonArea(startShape());

    let massSumX=0, massSumY=0, massWeight=0;
    let wingFlatArea=0, wingProjArea=0;
    let wingMinSpan=Infinity, wingMaxSpan=-Infinity;
    let dihedralWeighted=0, dihedralWeight=0;

    panels.forEach(panel=>{
      const flatArea = polygonArea(panel.poly2d);
      if(flatArea<1e-6) return;
      const world = panel.poly2d.map(pt=> pointFromChainWithAxes(pt, panel.hingeChain, axes, getAngle));
      const proj = world.map(p=>({x:p.x, y:p.y})); // top-down projection, ignoring z

      const centroid = polygonCentroid(proj);
      massSumX += centroid.x*flatArea;
      massSumY += centroid.y*flatArea;
      massWeight += flatArea;

      if(panel.hingeChain.length>0){
        const projArea = polygonArea(proj);
        wingFlatArea += flatArea;
        wingProjArea += projArea;
        proj.forEach(p=>{
          const spanCoord = mainAxisX ? p.y : p.x;
          wingMinSpan = Math.min(wingMinSpan, spanCoord);
          wingMaxSpan = Math.max(wingMaxSpan, spanCoord);
        });
        const lastHinge = hinges[panel.hingeChain[panel.hingeChain.length-1]];
        const localDihedral = Math.max(0, 180-lastHinge.angle);
        dihedralWeighted += localDihedral*flatArea;
        dihedralWeight += flatArea;
      }
    });

    const massCentroid = massWeight>0 ? {x:massSumX/massWeight, y:massSumY/massWeight} : polygonCentroid(pts);
    const alongNose = mainAxisX ? minX : minY;
    const alongTail = mainAxisX ? maxX : maxY;
    const alongCentroid = mainAxisX ? massCentroid.x : massCentroid.y;
    const massFrac = (alongCentroid - alongNose) / ((alongTail-alongNose) || 1);
    const idealMassFrac = 0.44;
    const massScore = Math.max(0, Math.min(1, 1 - Math.abs(massFrac-idealMassFrac)/idealMassFrac));

    const wingSpan = wingMaxSpan>wingMinSpan ? wingMaxSpan-wingMinSpan : 0;
    const aspectRatio = wingProjArea>1 ? (wingSpan*wingSpan)/wingProjArea : 0;
    const wingLoading = wingProjArea>1 ? flatTotalArea/wingProjArea : Infinity;
    const dihedralDeg = dihedralWeight>0 ? dihedralWeighted/dihedralWeight : 0;

    return { massScore, massFrac, aspectRatio, wingLoading, dihedralDeg, wingFlatArea, wingProjArea };
  }

  // Two flight regimes: a dart flies an almost-pure parabola driven mostly
  // by nose sharpness and symmetry (the original Модуль 4 formula); a
  // glider additionally rewards low wing loading, a sensible dihedral and
  // a healthy aspect ratio with extra distance and less wobble. Which one
  // applies depends entirely on the CURRENT spread — the same folded model
  // reads as a dart until its wings are actually sprung open.
  function evaluateFlight3D(pts){
    const base = evaluateFlight(pts);
    const aero = computeAerodynamics3D(pts, base);

    const isGlider = aero.dihedralDeg > GLIDER_MIN_DIHEDRAL
      && aero.wingLoading < GLIDER_MAX_LOADING
      && aero.aspectRatio > GLIDER_MIN_AR;

    const dartScore = 0.32*base.symmetry + 0.24*base.noseScore + 0.24*base.elongationScore + 0.20*aero.massScore;

    // Gliding is a BONUS mechanic layered on top of the dart baseline, never
    // a penalty: a plane that barely qualifies as a glider (glideScore near
    // 0 right at the threshold) should fly almost exactly like the same
    // plane just below the threshold would as a dart — no cliff at the
    // boundary — and only a genuinely well-tuned glide configuration should
    // meaningfully outperform the dart baseline.
    let glideScore = 0;
    if(isGlider){
      const idealDihedral = 10;
      const dihedralScore = Math.max(0, 1 - Math.abs(aero.dihedralDeg-idealDihedral)/20);
      const loadingScore = Math.max(0, Math.min(1, (GLIDER_MAX_LOADING-aero.wingLoading)/GLIDER_MAX_LOADING));
      const arScore = Math.max(0, Math.min(1, (aero.aspectRatio-GLIDER_MIN_AR)/2));
      glideScore = 0.45*dihedralScore + 0.30*loadingScore + 0.25*arScore;
    }

    const score = dartScore;
    const distance = Math.round(8 + dartScore*40 + glideScore*22);
    // Gliding smooths the flight, but as a proportional damping on the
    // asymmetry-driven wobble — never a flat subtraction, which could
    // (and did) exceed a small base wobble and clamp a genuinely
    // imperfect model down to a suspicious, unearned 0. A perfect
    // glideScore of 1 damps wobble by at most 40%; real asymmetry always
    // leaves some residual wobble behind.
    const baseWobble = (1-base.symmetry)*20 + (1-aero.massScore)*10;
    const wobble = Math.max(0, Math.round(baseWobble * (1 - glideScore*0.4)));

    return Object.assign({}, base, aero, {
      isGlider, flightMode: isGlider?'glider':'dart', dartScore, glideScore, score, distance, wobble
    });
  }

  function updateReadout(text){
    document.getElementById('readout').textContent = text;
  }

  // ---------- slope test animation (Пункт 3 дополнения) ----------
  // Runs inside the same Three.js scene the assembled-model preview uses
  // (Пункт 1): the person throws down the actual slope, not into a flat
  // field, and a glider gets a float phase that can briefly gain height
  // off the slope's updraft before settling into its glide, instead of a
  // dart's plain ballistic hump. The model itself flies in its real,
  // currently-spread 3D shape rather than a flattened cutout.
  function buildTerrainMesh(groundYFn, farX){
    const pts = [];
    for(let x=-80; x<=farX; x+=20) pts.push({x, y: groundYFn(x)});
    const shapePts = [{x:-80,y:220}, ...pts, {x:farX,y:-320}, {x:-80,y:-320}];
    const shape = new THREE.Shape();
    shape.moveTo(shapePts[0].x, shapePts[0].y);
    shapePts.slice(1).forEach(p=> shape.lineTo(p.x,p.y));
    const geom = new THREE.ShapeGeometry(shape);
    const mat = new THREE.MeshBasicMaterial({ color:0xcfead0, side:THREE.DoubleSide });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.z = -30;
    return mesh;
  }

  function buildPersonGroup(baseX, baseY){
    const g = new THREE.Group();
    const lineMat = new THREE.LineBasicMaterial({ color:0x2b2a28 });
    function seg(x1,y1,x2,y2){
      const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,y1,0), new THREE.Vector3(x2,y2,0)]);
      return new THREE.Line(geo, lineMat);
    }
    g.add(seg(0,38,0,14));      // body
    g.add(seg(0,14,-10,-6));    // leg
    g.add(seg(0,14,10,-6));     // leg
    g.add(seg(0,30,20,42));     // throwing arm, reaching forward/down-slope
    const head = new THREE.Mesh(new THREE.SphereGeometry(8,10,10), new THREE.MeshBasicMaterial({ color:0x2b2a28, wireframe:true }));
    head.position.set(0,46,0);
    g.add(head);
    g.position.set(baseX, baseY, 0);
    return g;
  }

  function runSlopeTest(){
    if(typeof THREE==='undefined') return;
    const result = evaluateFlight3D(shape);
    updateReadout('Запуск...');

    const HILL_DROP = 150, HILL_LENGTH = 190;
    function groundY(x){ return x<=HILL_LENGTH ? -x*(HILL_DROP/HILL_LENGTH) : -HILL_DROP; }

    const totalFlightX = 220 + result.distance*7;
    const personX = -10;
    const launchX = personX + 45, launchHeight = 42;

    planeGroup.visible = false;
    const flight = buildAssembledMeshGroup(i=>hinges[i].angle);
    const terrain = buildTerrainMesh(groundY, totalFlightX + 60);
    const person = buildPersonGroup(personX, groundY(personX));
    scene3d.add(flight.group);
    scene3d.add(terrain);
    scene3d.add(person);

    const savedCamPos = camera3d.position.clone();
    camera3d.position.set(totalFlightX*0.42, 40, 480);
    camera3d.lookAt(totalFlightX*0.42, -60, 0);

    function xAt(t){ return launchX + (totalFlightX-launchX)*t; }
    // height ABOVE the (already descending) slope profile: a dart is a
    // plain ballistic hump that returns to the ground by t=1; a glider
    // rises fast, rides the slope's updraft for an extended float, then
    // eases down into its final glide.
    function floatAt(t){
      if(!result.isGlider) return Math.sin(Math.PI*t) * 55;
      const rise = Math.min(1, t/0.18);
      const fallStart = 0.6;
      const fall = t<=fallStart ? 0 : (t-fallStart)/(1-fallStart);
      return rise * (1 - Math.pow(Math.min(1,fall), 1.6)) * 100;
    }
    function wobbleAt(t){ return Math.sin(t*16) * result.wobble * t * 0.6; }
    // launchHeight fades out over the flight so the model actually settles
    // onto the ground profile by t=1 instead of hovering at hand-height forever.
    function yAt(t){ return groundY(xAt(t)) + launchHeight*(1-t) + floatAt(t) + wobbleAt(t); }
    function angleAt(t){
      const dt = 0.02, t1=Math.max(0,t-dt), t2=Math.min(1,t+dt);
      return Math.atan2(yAt(t2)-yAt(t1), xAt(t2)-xAt(t1));
    }

    const duration = result.isGlider ? 2200 : 1500;
    const t0 = performance.now();

    function cleanupAndRestore(){
      disposeGroupDeep(flight.group);
      terrain.geometry.dispose();
      scene3d.remove(terrain);
      disposeGroupDeep(person);
      camera3d.position.copy(savedCamPos);
      updateCamera3d();
      planeGroup.visible = true;
      render3D();
    }

    function frame(now){
      const t = Math.min(1, (now-t0)/duration);
      flight.group.position.set(xAt(t), yAt(t), 0);
      flight.group.rotation.z = angleAt(t) - 0.25;
      renderer3d.render(scene3d, camera3d);
      if(t<1){
        requestAnimationFrame(frame);
      } else {
        const modeLabel = result.isGlider ? 'планер' : 'дротик';
        updateReadout(`Дальность полёта: ${result.distance} м  •  режим: ${modeLabel}  •  симметрия: ${Math.round(result.symmetry*100)}%  •  V-образность: ${Math.round(result.dihedralDeg)}°  •  удлинение крыла: ${result.aspectRatio.toFixed(2)}  •  нагрузка на крыло: ${Number.isFinite(result.wingLoading) ? result.wingLoading.toFixed(2) : '—'}`);
        cleanupAndRestore();
      }
    }
    requestAnimationFrame(frame);
  }

  // ---------- 3D scene (Three.js) ----------
  // Shows the paper as it's actually assembled — flat panels hinged along
  // each fold line — rather than the flattened 2D silhouette above. Every
  // hinge defaults to 180° (fully folded, exactly reproducing the 2D
  // outline when viewed from above with the "Раскрытие" slider at 0), and
  // the slider opens every hinge together toward a shallower angle so the
  // model can be seen — and eventually measured — in real 3D.
  const canvas3d = document.getElementById('scene3d');
  const W3 = canvas3d.width, H3 = canvas3d.height;
  const renderer3d = new THREE.WebGLRenderer({ canvas: canvas3d, antialias:true, alpha:true });
  renderer3d.setSize(W3, H3, false);
  renderer3d.setPixelRatio(window.devicePixelRatio||1);

  const scene3d = new THREE.Scene();
  const camera3d = new THREE.PerspectiveCamera(38, W3/H3, 1, 5000);

  scene3d.add(new THREE.AmbientLight(0xffffff, 0.6));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
  keyLight.position.set(220, 420, 320);
  scene3d.add(keyLight);

  const planeGroup = new THREE.Group();
  scene3d.add(planeGroup);

  const paperMaterial = new THREE.MeshStandardMaterial({ color:0xf6f3ea, side:THREE.DoubleSide, roughness:0.92, metalness:0.0 });
  const edgeMaterial = new THREE.LineBasicMaterial({ color:0x6b6558 });
  let panelMeshes = [];

  // manual mouse-drag orbit (kept dependency-free, no OrbitControls addon)
  let camYaw = 0.6, camPitch = 0.35, camDist = 480;
  function updateCamera3d(){
    const cy = Math.cos(camPitch), sy = Math.sin(camPitch);
    const cx = Math.cos(camYaw), sx = Math.sin(camYaw);
    camera3d.position.set(camDist*cy*sx, camDist*sy, camDist*cy*cx);
    camera3d.lookAt(0,0,0);
  }
  updateCamera3d();

  let dragging3d=false, last3dX=0, last3dY=0;
  canvas3d.addEventListener('mousedown', e=>{ dragging3d=true; last3dX=e.clientX; last3dY=e.clientY; });
  window.addEventListener('mousemove', e=>{
    if(!dragging3d) return;
    const dx=e.clientX-last3dX, dy=e.clientY-last3dY;
    last3dX=e.clientX; last3dY=e.clientY;
    camYaw -= dx*0.008;
    camPitch = Math.max(-1.3, Math.min(1.3, camPitch + dy*0.008));
    updateCamera3d();
    renderer3d.render(scene3d, camera3d);
  });
  window.addEventListener('mouseup', ()=>{ dragging3d=false; });

  function rotatePointAroundAxis(p, axisPoint, axisDir, angleDeg){
    const theta = angleDeg*Math.PI/180;
    const rel = {x:p.x-axisPoint.x, y:p.y-axisPoint.y, z:p.z-axisPoint.z};
    const k = axisDir;
    const kdotrel = k.x*rel.x + k.y*rel.y + k.z*rel.z;
    const kxrel = { x:k.y*rel.z-k.z*rel.y, y:k.z*rel.x-k.x*rel.z, z:k.x*rel.y-k.y*rel.x };
    const cosT=Math.cos(theta), sinT=Math.sin(theta);
    return {
      x: axisPoint.x + rel.x*cosT + kxrel.x*sinT + k.x*kdotrel*(1-cosT),
      y: axisPoint.y + rel.y*cosT + kxrel.y*sinT + k.y*kdotrel*(1-cosT),
      z: axisPoint.z + rel.z*cosT + kxrel.z*sinT + k.z*kdotrel*(1-cosT),
    };
  }
  function normalize3(v){ const l=Math.hypot(v.x,v.y,v.z)||1; return {x:v.x/l,y:v.y/l,z:v.z/l}; }

  // Compute every hinge's own WORLD axis under a chosen angle policy
  // (`getAngle(hingeIndex) -> degrees`), so the same machinery can answer
  // both "where is everything with all hinges closed" (used to keep
  // folding itself self-consistent) and "where is everything at the
  // slider's current spread" (used for display). Each hinge's axis is
  // itself carried along by whatever hinges came before it in its
  // ancestorChain; processing hinges in creation order means every
  // ancestor's world axis is already known by the time it's needed.
  function computeWorldAxesWithAngles(getAngle){
    const axesByHinge = [];
    hinges.forEach((h, idx)=>{
      let p3 = {x:h.axisP.x, y:h.axisP.y, z:0};
      let q3 = {x:h.axisP.x+h.axisDir.x, y:h.axisP.y+h.axisDir.y, z:0};
      h.ancestorChain.forEach(ai=>{
        const a = axesByHinge[ai];
        const ang = getAngle(ai);
        p3 = rotatePointAroundAxis(p3, a.worldAxisP, a.worldAxisDir, ang);
        q3 = rotatePointAroundAxis(q3, a.worldAxisP, a.worldAxisDir, ang);
      });
      axesByHinge[idx] = { worldAxisP:p3, worldAxisDir: normalize3({x:q3.x-p3.x, y:q3.y-p3.y, z:q3.z-p3.z}) };
    });
    return axesByHinge;
  }

  // Walk a 2D point that lives at hinge-angle-0 (in the LAST hinge of
  // `chain`'s local frame) through that chain to its 3D position, using
  // pre-computed world axes and the same angle policy they were built with.
  function pointFromChainWithAxes(raw2d, chain, axesByHinge, getAngle){
    let p3 = {x:raw2d.x, y:raw2d.y, z:0};
    for(const hi of chain){
      const a = axesByHinge[hi];
      p3 = rotatePointAroundAxis(p3, a.worldAxisP, a.worldAxisDir, getAngle(hi));
    }
    return p3;
  }

  // Undo a chain of all-closed (180°) hinge rotations to recover a point's
  // local coordinates relative to the panel's own last hinge. A 180°
  // rotation is its own inverse, so "undo" is just re-applying the same
  // rotations in reverse order.
  function undoClosedChain(worldPt2D, chain, axesClosed){
    let p3 = {x:worldPt2D.x, y:worldPt2D.y, z:0};
    for(let i=chain.length-1;i>=0;i--){
      const a = axesClosed[chain[i]];
      p3 = rotatePointAroundAxis(p3, a.worldAxisP, a.worldAxisDir, 180);
    }
    return {x:p3.x, y:p3.y};
  }

  function pointInTriangle(p,a,b,c){
    const d1 = (p.x-b.x)*(a.y-b.y)-(a.x-b.x)*(p.y-b.y);
    const d2 = (p.x-c.x)*(b.y-c.y)-(b.x-c.x)*(p.y-c.y);
    const d3 = (p.x-a.x)*(c.y-a.y)-(c.x-a.x)*(p.y-a.y);
    const hasNeg = (d1<0)||(d2<0)||(d3<0), hasPos = (d1>0)||(d2>0)||(d3>0);
    return !(hasNeg&&hasPos);
  }

  // Ear-clipping triangulation in the panel's own flat 2D coordinates —
  // needed because panels can be concave, where a naive vertex fan would
  // produce inverted/overlapping triangles.
  function triangulatePolygon2D(poly){
    let signedA = 0;
    for(let i=0;i<poly.length;i++){ const p=poly[i], q=poly[(i+1)%poly.length]; signedA += p.x*q.y - q.x*p.y; }
    const remaining = signedA<0 ? poly.map((_,i)=>i).reverse() : poly.map((_,i)=>i);
    const tris = [];
    let guard = 0;
    while(remaining.length>3 && guard++<2000){
      let earFound=false;
      for(let i=0;i<remaining.length;i++){
        const iPrev = remaining[(i-1+remaining.length)%remaining.length];
        const iCur = remaining[i];
        const iNext = remaining[(i+1)%remaining.length];
        const a=poly[iPrev], b=poly[iCur], c=poly[iNext];
        const cross = (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
        if(cross <= 1e-9) continue; // reflex or degenerate corner, not an ear
        const isEar = remaining.every(j => j===iPrev||j===iCur||j===iNext || !pointInTriangle(poly[j],a,b,c));
        if(isEar){ tris.push([iPrev,iCur,iNext]); remaining.splice(i,1); earFound=true; break; }
      }
      if(!earFound) break; // degenerate input — stop rather than loop forever
    }
    if(remaining.length===3) tris.push([remaining[0],remaining[1],remaining[2]]);
    return tris;
  }

  // Build a fresh, self-contained Three.js group holding every panel as a
  // triangulated mesh + wire outline, at whatever hinge angles `getAngle`
  // reports, centered on the model's own bounding centroid. Used both for
  // the persistent "assembled model" preview and for the slope-test's
  // flying plane, which needs its own independent group it can translate
  // and rotate along a flight path without disturbing the preview.
  function buildAssembledMeshGroup(getAngle){
    const axes = computeWorldAxesWithAngles(getAngle);
    const group = new THREE.Group();
    const meshes = [];

    const allWorldPts = [];
    panels.forEach(panel=> panel.poly2d.forEach(pt=> allWorldPts.push(pointFromChainWithAxes(pt, panel.hingeChain, axes, getAngle))));
    if(allWorldPts.length===0) return { group, meshes };
    const cx = allWorldPts.reduce((s,p)=>s+p.x,0)/allWorldPts.length;
    const cy = allWorldPts.reduce((s,p)=>s+p.y,0)/allWorldPts.length;
    const cz = allWorldPts.reduce((s,p)=>s+p.z,0)/allWorldPts.length;

    panels.forEach(panel=>{
      if(panel.poly2d.length<3) return;
      // canvas y grows downward; three.js y grows upward, so flip it here
      const worldPts = panel.poly2d.map(pt=>{
        const w = pointFromChainWithAxes(pt, panel.hingeChain, axes, getAngle);
        return { x:w.x-cx, y:-(w.y-cy), z:w.z-cz };
      });

      const tris = triangulatePolygon2D(panel.poly2d);
      const positions = [];
      tris.forEach(([a,b,c])=>{
        positions.push(worldPts[a].x,worldPts[a].y,worldPts[a].z);
        positions.push(worldPts[b].x,worldPts[b].y,worldPts[b].z);
        positions.push(worldPts[c].x,worldPts[c].y,worldPts[c].z);
      });
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
      geom.computeVertexNormals();
      const mesh = new THREE.Mesh(geom, paperMaterial);
      group.add(mesh);

      const edgePos = [];
      worldPts.concat([worldPts[0]]).forEach(p=> edgePos.push(p.x,p.y,p.z));
      const edgeGeom = new THREE.BufferGeometry();
      edgeGeom.setAttribute('position', new THREE.Float32BufferAttribute(edgePos,3));
      const edges = new THREE.Line(edgeGeom, edgeMaterial);
      group.add(edges);

      meshes.push({mesh, edges});
    });

    return { group, meshes };
  }

  function disposeGroupDeep(obj){
    obj.children.slice().forEach(disposeGroupDeep);
    if(obj.geometry) obj.geometry.dispose();
    if(obj.parent) obj.parent.remove(obj);
  }

  function render3D(){
    if(typeof THREE==='undefined') return;
    panelMeshes.forEach(m=>{ planeGroup.remove(m.mesh); planeGroup.remove(m.edges); m.mesh.geometry.dispose(); m.edges.geometry.dispose(); });
    panelMeshes = [];

    const built = buildAssembledMeshGroup(i => hinges[i].angle);
    built.group.children.slice().forEach(child=>{ built.group.remove(child); planeGroup.add(child); });
    panelMeshes = built.meshes;

    renderer3d.render(scene3d, camera3d);
  }

  const spreadSlider = document.getElementById('spreadSlider');
  const spreadValueLabel = document.getElementById('spreadValue');
  const HINGE_CLOSED_ANGLE = 180, HINGE_OPEN_ANGLE = 90;
  spreadSlider.addEventListener('input', ()=>{
    const t = spreadSlider.value/100;
    const angle = HINGE_CLOSED_ANGLE + (HINGE_OPEN_ANGLE-HINGE_CLOSED_ANGLE)*t;
    hinges.forEach(h=> h.angle = angle);
    spreadValueLabel.textContent = Math.round(t*100)+'%';
    render3D();
  });

  // ---------- wire up UI ----------
  document.getElementById('undoBtn').addEventListener('click', ()=>{ undo(); draw(); });
  document.getElementById('flipBtn').addEventListener('click', ()=>{ flipShape(); draw(); });
  document.getElementById('resetBtn').addEventListener('click', ()=>{ reset(); draw(); });
  document.getElementById('testBtn').addEventListener('click', runSlopeTest);

  draw();
  render3D();
})();
</script>
</body>
</html>
